{% extends 'base.html' %}

{% block titulo %}Modificar Tarea{% endblock %}

{% block contenido %}
<h2>Modificar Tarea</h2>

<form method="POST">
    {% csrf_token %}
    {{ form.as_p }}
    <br>
    <button type="submit" class="btn btn-primary" style="background-color: #0d6efd; color: white; padding: 6px 12px; border: none; border-radius: 4px; cursor: pointer;">
        Guardar Cambios
    </button>
    <a href="{% url 'lista_tareas' %}" class="btn btn-secondary" style="background-color: #6c757d; color: white; padding: 6px 12px; text-decoration: none; border-radius: 4px; display: inline-block;">
        Cancelar
    </a>
</form>
{% endblock %}
