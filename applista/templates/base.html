<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{% block titulo %}Mi Gestor de Tareas{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f4; }
        .container { max-width: 650px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .completada { text-decoration: line-through; color: #888; }
        .pendiente { color: #d9534f; font-weight: bold; }
        .badge { padding: 3px 8px; border-radius: 4px; font-size: 0.8em; color: white; }
        .bg-success { background-color: #28a745; }
        .bg-danger { background-color: #dc3545; }
        nav { margin-bottom: 20px; }
        nav a { margin-right: 15px; color: #0d6efd; text-decoration: none; font-weight: bold; }
        nav a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="container">
        <nav>
            <a href="{% url 'lista_tareas' %}">Lista</a>
            <a href="{% url 'agregar_tarea' %}">Agregar Tarea</a>
        </nav>
        <header>
            <h1>Mi Gestor de Tareas</h1>
            <hr>
        </header>
        <main>
            {% block contenido %}
            {% endblock %}
        </main>
    </div>
</body>
</html>
